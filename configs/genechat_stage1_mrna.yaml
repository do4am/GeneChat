model:
  arch: genechat
  model_type: pretrain_vicuna

  # Stage 1 mRNA: train adaptor only (encoder + LLM frozen)
  freeze_gene_encoder: True
  freeze_adaptor: False
  freeze_llama: True

  # mRNA sequences are short (~2,000 bp) → far fewer chunks than genomic DNA
  max_gene_length: 5000    # matches joint config — consistent embedding distribution
  keyword_loss_alpha: 3.0  # upweight gene-name tokens in loss

  gene_model: "hyenadna-medium-160k-seqlen"

  llama_model: "/home/namdo/applications/GeneChat/llama_pretrained/vicuna-13b-v1.5"
  prompt: ""

  max_txt_len: 512
  end_sym: "</s>"
  low_resource: False
  embedding_agg: 1
  peft_ckpt: ''
  stage1_ckpt: ''

datasets:
  seq_mrna:                        # uses SeqBuilderMrna / SeqDatasetMrna
    data_type: gene
    build_info:
      train:
        storage: /home/namdo/applications/data_hm/train_hm
      valid:
        storage: /home/namdo/applications/data_hm/valid_hm

run:
  task: protein_text_pretrain
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4
  min_lr: 1e-6
  warmup_lr: 1e-7
  accum_grad_iters: 1

  weight_decay: 0
  max_epoch: 7                  # 35000 / 5000 = 7, cosine spans full stage1 run
  max_iters: 35000
  iters_per_inner_epoch: 5000      # checkpoint every 5000 iters
  log_freq: 10

  batch_size_train: 4
  batch_size_eval: 1
  num_workers: 4
  warmup_steps: 500

  seed: 15592
  output_dir: "/data2/namdo/checkpoint_stage1_mrna"

  amp: True
  resume_ckpt_path: ""

  printable: True

  evaluate: False
  train_splits: ["train"]
  valid_splits: ["valid"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
  use_dist_eval_sampler: False
