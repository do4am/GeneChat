# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  GeneChat  —  Stage 2 with NT-v2 500M encoder                           ║
# ║                                                                          ║
# ║  Starting point: Stage 1 checkpoint (checkpoint_20000.pth)              ║
# ║  Encoder:  NT-v2 500M  (LoRA r=16, unfrozen)                            ║
# ║  Adaptor:  MLP  1024 → 2048 → 5120  (continues training)               ║
# ║  LLM:      Vicuna-13B  (LoRA r=16, continues training)                  ║
# ╚══════════════════════════════════════════════════════════════════════════╝

model:
  arch: genechat
  model_type: pretrain_vicuna

  encoder_type: "nt_v2"
  adaptor_type: "mlp"

  freeze_gene_encoder: False  # NT-v2 LoRA active
  freeze_adaptor: False
  freeze_llama: False

  max_gene_length: 5000
  keyword_loss_alpha: 3.0

  gene_model: ""
  llama_model: "/home/namdo/applications/GeneChat/llama_pretrained/vicuna-13b-v1.5"
  prompt: ""

  max_txt_len: 512
  end_sym: "</s>"
  low_resource: False
  embedding_agg: 1

  peft_ckpt: '/data2/namdo/checkpoint_ntv2_stage1/20260429055/checkpoint_20000.pth'
  stage1_ckpt: ''

datasets:
  seq_mrna:
    data_type: gene
    build_info:
      train:
        storage: /home/namdo/applications/data_hm/train_hm
      valid:
        storage: /home/namdo/applications/data_hm/valid_hm

run:
  task: protein_text_pretrain

  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 5e-6         # reduced from 2e-5 to prevent overfitting
  min_lr: 1e-7
  warmup_lr: 1e-8
  warmup_steps: 500
  accum_grad_iters: 1

  weight_decay: 0.05
  max_epoch: 10
  max_iters: 50000
  iters_per_inner_epoch: 5000
  iters_per_epoch: 5000
  log_freq: 10

  batch_size_train: 8
  batch_size_eval: 1
  num_workers: 4

  seed: 15592
  output_dir: "/data2/namdo/checkpoint_ntv2_stage2"

  amp: True
  resume_ckpt_path: ""
  reset_iters: True

  printable: True
  evaluate: False
  train_splits: ["train"]
  valid_splits: ["valid"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False

  # ── Launch ────────────────────────────────────────────────────────────────
  # CUDA_VISIBLE_DEVICES=3 conda run -n genechat --no-capture-output \
  #   python train_esm.py --cfg-path configs/genechat_stage2_ntv2.yaml \
  #   2>&1 | tee result_mrna/train_ntv2_stage2.log
